  <path d="M 13 16 Q 14 14 16 16" stroke="#334155" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <circle cx="7.5" cy="18" r="1.3" fill="#fca5a5"/>
