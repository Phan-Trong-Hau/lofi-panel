  <!-- Left/Right Earcups -->
  <rect x="2" y="13" width="2.5" height="6" rx="1.2" fill="#a855f7"/>
  <rect x="19.5" y="13" width="2.5" height="6" rx="1.2" fill="#a855f7"/>
  <!-- Mini Sound Bars -->
